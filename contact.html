<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Revival of Romiosini</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="imperial-band"><div class="container"><div class="dateline" id="dateline"></div><div class="top-links"><a href="index.html">Home</a> <a href="about.html">About</a></div></div></div>
    <header class="masthead">
        <div class="container masthead-inner">
            <svg class="masthead-ornament" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" stroke="#2A1124" stroke-width="2"/><circle cx="40" cy="40" r="28" stroke="#D4AF37" stroke-width="1"/><path d="M40 12 L40 68 M12 40 L68 40 M20 20 L60 60 M60 20 L20 60" stroke="#2A1124" stroke-width="1.5"/><circle cx="40" cy="40" r="6" fill="#D4AF37"/></svg>
            <div class="masthead-center">
                <div class="logo-greek">Ἀναβίωσις τῆς Ῥωμιοσύνης</div>
                <div class="logo-main">Revival <span class="of">of</span> Romiosini</div>
                <div class="logo-divider"><div class="logo-divider-line"></div><div class="logo-diamond"></div><div class="logo-divider-line"></div></div>
                <div class="logo-sub">History · Diaspora · Heritage · News</div>
            </div>
            <svg class="masthead-ornament" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" stroke="#2A1124" stroke-width="2"/><circle cx="40" cy="40" r="28" stroke="#D4AF37" stroke-width="1"/><path d="M40 12 L40 68 M12 40 L68 40 M20 20 L60 60 M60 20 L20 60" stroke="#2A1124" stroke-width="1.5"/><circle cx="40" cy="40" r="6" fill="#D4AF37"/></svg>
        </div>
    </header>
    <nav class="main-nav"><div class="container"><div class="nav-inner"><ul><li><a href="index.html">Home</a></li><li><a href="contact.html" class="active">Contact</a></li></ul></div></div></nav>

    <main>
        <div class="container" style="padding:60px 20px;max-width:700px;margin:0 auto;">
            <h1 style="font-family:'Playfair Display',serif;font-size:2.5rem;color:var(--purple-deepest);margin-bottom:10px;">Get in Touch</h1>
            <p style="color:var(--text-muted);margin-bottom:30px;">We welcome article submissions, story tips, and community announcements. Write to us in English or Greek.</p>
            <form action="#" method="post" style="background:var(--bg-white);padding:30px;border:1px solid var(--border-light);">
                <label style="display:block;font-family:'Source Sans 3',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:0.75rem;margin-bottom:6px;">Your Name</label>
                <input type="text" name="name" required style="width:100%;padding:12px;margin-bottom:20px;border:1px solid var(--border-light);font-family:'Crimson Pro',serif;font-size:1rem;">
                <label style="display:block;font-family:'Source Sans 3',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:0.75rem;margin-bottom:6px;">Email</label>
                <input type="email" name="email" required style="width:100%;padding:12px;margin-bottom:20px;border:1px solid var(--border-light);font-family:'Crimson Pro',serif;">
                <label style="display:block;font-family:'Source Sans 3',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:0.75rem;margin-bottom:6px;">Subject</label>
                <input type="text" name="subject" style="width:100%;padding:12px;margin-bottom:20px;border:1px solid var(--border-light);font-family:'Crimson Pro',serif;">
                <label style="display:block;font-family:'Source Sans 3',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:0.75rem;margin-bottom:6px;">Message</label>
                <textarea name="message" rows="6" required style="width:100%;padding:12px;margin-bottom:20px;border:1px solid var(--border-light);font-family:'Crimson Pro',serif;font-size:1rem;"></textarea>
                <button type="submit" style="background:var(--purple-deepest);color:var(--gold-bright);border:none;padding:14px 30px;font-family:'Source Sans 3',sans-serif;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;"
                    onmouseover="this.style.background='var(--gold-bright)';this.style.color='var(--purple-deepest)';"
                    onmouseout="this.style.background='var(--purple-deepest)';this.style.color='var(--gold-bright)';">
                    Send Message
                </button>
                <p style="font-size:0.75rem;color:var(--text-muted);margin-top:15px;">Or DM us on <a href="https://www.instagram.com/revival_of_romiosini/" style="color:var(--crimson);">Instagram</a>.</p>
            </form>
        </div>
    </main>
    <footer><div class="container"><div class="footer-bottom">&copy; 2026 Revival of Romiosini</div></div></footer>
    <script src="js/main.js" defer></script>
</body>
</html>
